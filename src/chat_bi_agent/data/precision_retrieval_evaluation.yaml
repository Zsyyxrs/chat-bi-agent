# P1 精准取数集：Precision Data Retrieval
# 每道题测试 NL2SQL Agent 的精准取数能力
# 结构：
#   - question: 用户提问（中文自然语言查询）
#   - expected_sql: 参考 SQL（Agent 应生成等价的 SQL）
#   - expected_result_columns: 期望返回的列名
#   - expected_result_count: 期望返回的行数范围
#   - expected_filters: 期望应用的过滤条件
#   - evaluation_criteria: 评估标准
#
# expected_result_count 由 gold SQL 真打 PG 回填（2026-08-14），不是手写估的。
# 此前 q001/q003/q004 三题仍是初版种子数据的行数，reseed 后已失真——SQL 逐字符
# 正确也会因行数断言失败被扣 0.15（result_count 权重），静默压低分数。
# 改 dimension_generator 或重新 seed 后必须重跑回填，否则同样的静默扣分会复发。

evaluation_questions:
  # ============================================================
  # 基础维度导航类题目
  # ============================================================

  - id: precision_q001
    question: |
      查询上海分行（BR_CITY_0006）所有高净值客户的客户 ID、姓名和客户等级。
    expected_sql: |
      SELECT customer_id, customer_name, customer_tier
      FROM dim_customer
      WHERE branch_id = 'BR_CITY_0006'
        AND customer_tier = 'HIGH_NET_WORTH'
    expected_result_columns: [customer_id, customer_name, customer_tier]
    expected_filters:
      - branch_id: BR_CITY_0006
      - customer_tier: HIGH_NET_WORTH
    expected_result_count:
      min: 29
      max: 29
    evaluation_criteria:
      - table_selection: "Agent 是否正确选择 dim_customer 表"
      - filter_accuracy: "Agent 是否正确应用两个过滤条件"
      - column_selection: "Agent 是否选择了正确的列"

  - id: precision_q002
    question: |
      统计有多少个产品分类为理财且风险等级为高？
    expected_sql: |
      SELECT COUNT(*) as product_count
      FROM dim_product
      WHERE product_category = 'WEALTH'
        AND risk_level = 'R5'
    expected_result_columns: []
    expected_filters:
      - product_category: WEALTH
      - risk_level: R5
    expected_result_count:
      min: 1
      max: 1
    evaluation_criteria:
      - aggregation_function: "Agent 是否使用了 COUNT 聚合函数"
      - filter_conditions: "Agent 是否正确组合了两个过滤条件（AND）"

  # ============================================================
  # 时间窗口过滤类题目
  # ============================================================

  - id: precision_q003
    question: |
      查询 2026 年 4 月 28 日当天发生的所有交易，返回交易 ID、账户 ID、交易金额和交易类型。
    expected_sql: |
      SELECT transaction_id, account_id, amount, transaction_type
      FROM fct_transaction
      WHERE dt = DATE '2026-04-28'
    expected_result_columns: [transaction_id, account_id, amount, transaction_type]
    expected_filters:
      - dt: "2026-04-28"
    expected_result_count:
      min: 674
      max: 674
    evaluation_criteria:
      - date_filter: "Agent 是否正确理解日期过滤条件"
      - exact_match: "Agent 是否使用了等号（=）而非范围"
      - column_relevance: "Agent 返回的列是否与问题相关"

  - id: precision_q004
    question: |
      找出 2026 年 2 月 15-23 日期间，交易渠道为 ATM 或 COUNTER 的现金支取交易。
      返回交易日期、账户 ID、金额和交易渠道。
    expected_sql: |
      SELECT dt, account_id, amount, transaction_channel
      FROM fct_transaction
      WHERE dt >= DATE '2026-02-15'
        AND dt <= DATE '2026-02-23'
        AND transaction_type = 'WITHDRAW'
        AND transaction_channel IN ('ATM', 'COUNTER')
    expected_result_columns: [dt, account_id, amount, transaction_channel]
    expected_filters:
      - dt_range: ["2026-02-15", "2026-02-23"]
      - transaction_type: WITHDRAW
      - transaction_channel: [ATM, COUNTER]
    expected_result_count:
      min: 88
      max: 88
    evaluation_criteria:
      - date_range: "Agent 是否正确处理了日期范围（BETWEEN 或 >= AND <=）"
      - multi_value_filter: "Agent 是否使用了 IN 或 OR 处理多个渠道"
      - logical_combination: "Agent 是否正确组合了 AND 和 IN 条件"

  # ============================================================
  # 多表关联+维度导航题目
  # ============================================================

  - id: precision_q005
    # 余额是 stock 指标，跨日求和无意义（原 gold 把 2 月 28 天日快照相加得
    # 137,120,000 ≈ 月末值 5,000,000 的 27.4 倍）。「总和」指跨账户求和，
    # 因此把时点钉在月末快照上。
    question: |
      杭州分行（BR_CITY_0000）在 2026 年 2 月末（2 月 28 日）的定期存款余额总和是多少？
    expected_sql: |
      SELECT COALESCE(SUM(fbd.balance), 0) as total_balance
      FROM fct_balance_daily fbd
      JOIN dim_account da ON fbd.account_id = da.account_id
      WHERE da.branch_id = 'BR_CITY_0000'
        AND fbd.dt = DATE '2026-02-28'
        AND da.account_type = 'SAVING'
    expected_result_columns: []
    expected_filters:
      - branch_id: BR_CITY_0000
      - dt: "2026-02-28"
      - account_type: SAVING
    expected_result_count:
      min: 1
      max: 1
    evaluation_criteria:
      - join_correctness: "Agent 是否正确 JOIN dim_account 表"
      - point_in_time: "Agent 是否把余额取在单一时点而非跨日累加"
      - aggregation: "Agent 是否使用了 SUM 函数并处理 NULL"
      - account_type_filter: "Agent 是否按账户类型过滤"

  - id: precision_q006
    question: |
      分别统计杭州（BR_CITY_0000）和南京（BR_CITY_0002）两个分行的大众客户层级客户数量。
    expected_sql: |
      SELECT branch_id, COUNT(DISTINCT customer_id) as customer_count
      FROM dim_customer
      WHERE branch_id IN ('BR_CITY_0000', 'BR_CITY_0002')
        AND customer_tier = 'MASS'
      GROUP BY branch_id
    expected_result_columns: [branch_id]
    expected_filters:
      - branch_id: [BR_CITY_0000, BR_CITY_0002]
      - customer_tier: MASS
    expected_result_count:
      min: 2
      max: 2
    evaluation_criteria:
      - grouping: "Agent 是否正确使用了 GROUP BY"
      - distinct_counting: "Agent 是否使用了 DISTINCT 避免重复计数"
      - multi_filter: "Agent 是否正确处理了多分支过滤"

  # ============================================================
  # 复杂聚合 + 排序题目
  # ============================================================

  - id: precision_q007
    question: |
      按产品分类统计各类产品的平均风险等级评分，并按评分从高到低排序。
    expected_sql: |
      SELECT product_category,
             AVG(CASE risk_level
                   WHEN 'R1' THEN 1
                   WHEN 'R2' THEN 2
                   WHEN 'R3' THEN 3
                   WHEN 'R4' THEN 4
                   WHEN 'R5' THEN 5
                 END) as avg_risk_level
      FROM dim_product
      WHERE product_category IS NOT NULL
      GROUP BY product_category
      ORDER BY avg_risk_level DESC
    expected_result_columns: [product_category]
    expected_filters: []
    expected_result_count:
      min: 6
      max: 6
    evaluation_criteria:
      - aggregation_with_grouping: "Agent 是否正确使用了 AVG + GROUP BY"
      - ordering: "Agent 是否按 DESC 排序"
      - null_handling: "Agent 是否过滤了 NULL 值"

  - id: precision_q008
    # 三处修正（2026-08-14）：
    # 1. 题面明写「定期存款」但原 gold 没有 account_type 过滤（446 个账户全进，
    #    加 SAVING 后 111 个）——agent 反而过滤对了却被判错。
    # 2. Top-N 条数原本只在 gold 里硬编码 LIMIT 10，题面读作单数同样成立，
    #    故在题面里写死「前 10 个」。
    # 3. 原 gold 取「前段 MIN、后段 MAX」，那是最低值/最高值，不是题面说的
    #    「初始/末日」，且会系统性放大变化幅度；端点取法则在账户于窗口内开户/
    #    销户时静默丢行。改为前后两段日均对比——与 config/metrics.yaml 里
    #    deposit_balance 的 AVG(balance)「日均」口径一致，保留 CASE WHEN 条件
    #    聚合这一考点，且对缺失日期健壮。
    question: |
      列出 2026 年 4 月 14 日前后（前 7 天、后 7 天）定期存款日均余额变化最大的前 10 个账户，
      返回账户 ID、前段日均余额、后段日均余额和变化百分比。
    expected_sql: |
      SELECT *
      FROM (
        SELECT
          fbd.account_id,
          AVG(CASE WHEN fbd.dt < '2026-04-14' THEN fbd.balance END) AS pre_avg_balance,
          AVG(CASE WHEN fbd.dt >= '2026-04-14' THEN fbd.balance END) AS post_avg_balance,
          ROUND(
            (AVG(CASE WHEN fbd.dt >= '2026-04-14' THEN fbd.balance END) -
            AVG(CASE WHEN fbd.dt < '2026-04-14' THEN fbd.balance END)) /
            NULLIF(AVG(CASE WHEN fbd.dt < '2026-04-14' THEN fbd.balance END), 0) * 100, 2
          ) AS change_pct
        FROM fct_balance_daily fbd
        JOIN dim_account da ON fbd.account_id = da.account_id
        WHERE fbd.dt >= DATE '2026-04-07'
          AND fbd.dt <= DATE '2026-04-21'
          AND da.account_type = 'SAVING'
        GROUP BY fbd.account_id
      ) t
      ORDER BY ABS(change_pct) DESC
      LIMIT 10
    expected_result_columns: [account_id]
    expected_filters:
      - dt_range: ["2026-04-07", "2026-04-21"]
      - account_type: SAVING
    expected_result_count:
      min: 10
      max: 10
    evaluation_criteria:
      - window_analysis: "Agent 是否正确定义了前后两段时间窗口"
      - calculated_fields: "Agent 是否计算了百分比变化"
      - complex_aggregation: "Agent 是否使用了条件聚合（CASE WHEN + AVG）而非取端点"
      - ordering_and_limit: "Agent 是否按变化幅度排序并限制行数"

  # ============================================================
  # 值检索类题目（2026-08-26 新增）
  #
  # 与 q001~q008 的关键差异：**问题里不带任何数据库编码**。原有 8 题中有 5 题
  # 把机构编码直接写进了问题（如「上海分行（BR_CITY_0006）」），等于替 agent
  # 把「用户说的词 → 库里存的值」这一步做掉了，因此那 8 题测不到值检索能力。
  #
  # 这 3 题各自卡住一个真实的映射难点：
  #   q009 「上海」在库里是 province 的取值，不是 city，也不是某个 branch_name
  #   q010 「杭州分行」要反查 branch_id 才能过滤客户
  #   q011 「短期理财」是 product_subcategory 的取值，不是 product_category（那里存 WEALTH）
  #
  # 基线可比性：q001~q008 一字未动。跨 run 比对请用「原 8 题」口径，
  # 与 baseline_p1_eval_2026-08-15.json（avg 0.965）对齐；全量 11 题是新口径。
  # ============================================================

  - id: precision_q009
    question: |
      统计上海地区各家分行的客户数量，返回分行名称和客户数，按客户数从多到少排序。
    expected_sql: |
      SELECT b.branch_name, COUNT(c.customer_id) AS customer_count
      FROM dim_branch b
      JOIN dim_customer c ON c.branch_id = b.branch_id
      WHERE b.province = '上海'
      GROUP BY b.branch_name
      ORDER BY customer_count DESC
    expected_result_columns: [branch_name, customer_count]
    expected_filters:
      - province: 上海
    expected_result_count:
      min: 4
      max: 4
    evaluation_criteria:
      - value_grounding: "「上海」是否落到 dim_branch.province，而不是 city 或 branch_name 模糊匹配"
      - join_accuracy: "是否正确 join dim_branch 与 dim_customer"
      - aggregation_function: "是否按分行分组计数并正确排序"

  # ⚠️ 已知歧义题，**故意保留**，不要"修好"它。
  # 2026-08-26 实测：模型生成 `WHERE b.city = '杭州'`（205 行），gold 用
  # `WHERE b.branch_name = '杭州分行'`（58 行）——差 3.5 倍，因为 city='杭州'
  # 会把杭州营业部/营销中心/小微部/财富部 4 个支行一并卷入。
  #
  # 值检索本身没失职：它把 branch_name='杭州分行' 与 city='杭州' 两个候选都递给了
  # 模型，是模型在两者间选错。**多候选能暴露歧义，但不能消解歧义**——要解决得靠
  # 澄清追问或口径约定。保留此题是为了让这个真实的产品问题在评测里持续可见，
  # 改题面消歧会把它藏起来。
  - id: precision_q010
    question: |
      杭州分行有多少个大众层级的客户？
    expected_sql: |
      SELECT COUNT(*) AS customer_count
      FROM dim_customer c
      JOIN dim_branch b ON c.branch_id = b.branch_id
      WHERE b.branch_name = '杭州分行'
        AND c.customer_tier = 'MASS'
    expected_result_columns: []
    expected_filters:
      - branch_name: 杭州分行
      - customer_tier: MASS
    expected_result_count:
      min: 1
      max: 1
    evaluation_criteria:
      - value_grounding: "是否用 branch_name='杭州分行' 反查机构，而不是猜一个 branch_id"
      - enum_mapping: "「大众层级」是否映射到 customer_tier='MASS' 这个英文枚举"

  - id: precision_q011
    question: |
      列出所有短期理财产品的产品名称和风险等级。
    expected_sql: |
      SELECT product_name, risk_level
      FROM dim_product
      WHERE product_subcategory = '短期理财'
      ORDER BY product_name
    expected_result_columns: [product_name, risk_level]
    expected_filters:
      - product_subcategory: 短期理财
    expected_result_count:
      min: 5
      max: 5
    evaluation_criteria:
      - value_grounding: "「短期理财」是否落到 product_subcategory，而不是 product_category='WEALTH'"
      - column_selection: "是否只返回产品名称与风险等级两列"

  # ============================================================
  # 窗口函数类题目（2026-09-08 新增）
  #
  # 为什么补这三题：截至 2026-09-08，本题集 11 道 gold SQL **零窗口函数**
  # （最复杂的 q008 是 CTE + CASE WHEN 条件聚合）。而环比、组内排名、累计占比
  # 是 BI 取数最高频的三类分析型 SQL，链路在这一整类上的表现此前完全没有证据。
  #
  # 三题按窗口函数的三个族各取一个，翻车时能定位到具体是哪一族：
  #   q012 偏移族  LAG() OVER (ORDER BY ...)          —— 环比，分母要 NULLIF 防除零
  #   q013 排名族  ROW_NUMBER() OVER (PARTITION BY ...) —— 组内 Top-N，窗函数不能写在
  #                WHERE 里，必须套一层子查询再过滤，这是最经典的错法
  #   q014 帧族    SUM() OVER (ORDER BY ...) 与 SUM() OVER () —— 滚动帧与全局帧同题共存
  #
  # 三处刻意的设计：
  # （1）**题面带机构编码**。q009~q011 那批测的是值检索（「上海」→ province 取值），
  #     这批要隔离「窗口函数」这一个变量，所以把 BR_CITY_0000 直接写进题面。
  #     agent 失分就只可能失在窗函数上，不会和值检索的失败混在一起。
  # （2）**底表用 fct_transaction 而非 fct_balance_daily**。2026-09-08 实测：余额表在
  #     「杭州分行 + SAVING + 2026-06」这个切片上 25 个客户的日均余额**全部并列
  #     100000.00**，做排名和累计占比时 ROW_NUMBER 的名次分配不确定，gold 自己的
  #     结果集就是随机的。交易表同切片 2546 个客户对应 2545 个不同金额，几乎零并列。
  #     交易额是 flow 指标，跨日求和有业务意义——与 q005「余额是 stock，跨日求和无意义」
  #     的修正正好构成一对，两类口径在题集里都覆盖到了。
  # （3）**日期用闭区间 <= '2026-06-30' 而非 < '2026-07-01'**。两者对 DATE 列等价，
  #     但 expected_filters 是按字面值在生成的 SQL 里做词匹配的，写开区间会让
  #     「模型按题面自然写法用了 06-30」被判成过滤条件不符——那是评测器的锅，不是模型的。
  #
  # 基线可比性：q001~q011 一字未动。此前已有「原 8 题」（对齐
  # baseline_p1_eval_2026-08-15.json，avg 0.965）与「全量 11 题」两个口径，
  # 这批引入第三个口径「全量 14 题」。跨 run 比对务必声明用的是哪个口径。
  # ============================================================

  # gold 里的 `::DATE` 是必须的，不要"简化"掉。2026-09-08 首跑实测：模型写
  # `DATE_TRUNC('month', dt)::DATE`，gold 原本没有这个 cast，于是两边金额逐行完全相同、
  # 却被 result_match 判为不一致——_normalize_row 对非数值列走 str(v)，
  # timestamptz 的 "2026-01-01 00:00:00+08:00" 与 date 的 "2026-01-01" 字符串不等。
  # 这是评测器的**类级缺陷**（任何 gold 返回 timestamp 列的题都会被误判），
  # 已知未修；此处先让本题可比。result_match 不计入 combined_score，所以它误判时
  # 分数看不出来，只有诊断字段是红的——正是"静默失效"的又一种形态。
  - id: precision_q012
    question: |
      查询杭州分行（BR_CITY_0000）2026 年 1 月到 6 月每个月的交易总金额，
      以及相比上一个月的环比变化百分比。
    expected_sql: |
      SELECT
        m.month,
        m.total_amount,
        LAG(m.total_amount) OVER (ORDER BY m.month) AS prev_month_amount,
        ROUND(
          (m.total_amount - LAG(m.total_amount) OVER (ORDER BY m.month))
          / NULLIF(LAG(m.total_amount) OVER (ORDER BY m.month), 0) * 100, 2
        ) AS mom_pct
      FROM (
        SELECT DATE_TRUNC('month', ft.dt)::DATE AS month,
               SUM(ft.amount) AS total_amount
        FROM fct_transaction ft
        WHERE ft.branch_id = 'BR_CITY_0000'
          AND ft.dt >= DATE '2026-01-01'
          AND ft.dt <= DATE '2026-06-30'
        GROUP BY 1
      ) m
      ORDER BY m.month
    expected_result_columns: []
    expected_filters:
      - branch_id: BR_CITY_0000
      - dt_range: ["2026-01-01", "2026-06-30"]
    expected_result_count:
      min: 6
      max: 6
    evaluation_criteria:
      - window_function_offset: "是否用 LAG() OVER (ORDER BY 月份) 取上月值，而不是自连接或两次子查询"
      - period_grain: "是否按 DATE_TRUNC('month', dt) 聚合到月粒度"
      - division_guard: "环比分母是否做了 NULLIF/零值保护（首月无上月值应为 NULL 而非报错）"
      - first_row_semantics: "首月（2026-01）的环比是否留空，而不是硬填 0"

  - id: precision_q013
    question: |
      列出 2026 年 6 月每个城市级分行（branch_level 为 CITY）交易金额排名前 3 的客户，
      返回分行名称、客户姓名、交易金额和分行内排名。
    expected_sql: |
      SELECT dbr.branch_name, dc.customer_name, r.total_amount, r.rn AS rank_in_branch
      FROM (
        SELECT c.branch_id, c.customer_id, c.total_amount,
               ROW_NUMBER() OVER (
                 PARTITION BY c.branch_id ORDER BY c.total_amount DESC, c.customer_id
               ) AS rn
        FROM (
          SELECT ft.branch_id, ft.customer_id, SUM(ft.amount) AS total_amount
          FROM fct_transaction ft
          WHERE ft.dt >= DATE '2026-06-01'
            AND ft.dt <= DATE '2026-06-30'
          GROUP BY 1, 2
        ) c
      ) r
      JOIN dim_branch dbr ON r.branch_id = dbr.branch_id
      JOIN dim_customer dc ON r.customer_id = dc.customer_id
      WHERE r.rn <= 3
        AND dbr.branch_level = 'CITY'
      ORDER BY dbr.branch_name, r.rn
    expected_result_columns: [branch_name, customer_name]
    expected_filters:
      - branch_level: CITY
      - dt_range: ["2026-06-01", "2026-06-30"]
    expected_result_count:
      min: 45
      max: 45
    evaluation_criteria:
      - window_function_ranking: "是否用 ROW_NUMBER/RANK + PARTITION BY 分行取组内 Top-N"
      - window_in_where: "是否把窗口函数套进子查询后再过滤 rn <= 3，而不是直接写在 WHERE 里（那是语法错误）"
      - partition_key: "PARTITION BY 是否按分行，而不是全局排名后取前 3"
      - join_accuracy: "是否 join 到 dim_branch 取分行名并按 branch_level='CITY' 过滤"
      - grouping_key: |
          是否按 customer_id 聚合而不是 customer_name。2026-09-08 首跑实测模型写的是
          GROUP BY b.branch_name, c.customer_name——库里 5230 个客户只有 3801 个不同姓名，
          且同一分行内同名有 10 组，按姓名聚合会把不同客户的交易额合并。这一批的 top 3
          恰好没撞上同名客户，所以行数 45 对得上、result_match 也是 True、拿了 0.837 分。
          **本题集现有的任何一个维度都抓不住这个错**，留此条备忘。

  - id: precision_q014
    question: |
      按 2026 年 6 月的交易金额从高到低排列杭州分行（BR_CITY_0000）的客户，
      返回前 20 个客户的客户 ID、交易金额，以及按该排序累计的金额占全分行的百分比。
    expected_sql: |
      SELECT
        t.customer_id,
        t.total_amount,
        ROUND(
          SUM(t.total_amount) OVER (ORDER BY t.total_amount DESC, t.customer_id)
          / SUM(t.total_amount) OVER () * 100, 2
        ) AS cum_pct
      FROM (
        SELECT ft.customer_id, SUM(ft.amount) AS total_amount
        FROM fct_transaction ft
        WHERE ft.branch_id = 'BR_CITY_0000'
          AND ft.dt >= DATE '2026-06-01'
          AND ft.dt <= DATE '2026-06-30'
        GROUP BY 1
      ) t
      ORDER BY t.total_amount DESC, t.customer_id
      LIMIT 20
    expected_result_columns: [customer_id]
    expected_filters:
      - branch_id: BR_CITY_0000
      - dt_range: ["2026-06-01", "2026-06-30"]
    expected_result_count:
      min: 20
      max: 20
    evaluation_criteria:
      - window_function_frame: "累计值是否用 SUM() OVER (ORDER BY ...) 的滚动帧，而不是自连接求和"
      - grand_total_frame: "分母是否用 SUM() OVER () 全局帧取全分行合计，而不是再查一次表"
      - denominator_scope: "分母是否为**全部**客户的合计，而不是被 LIMIT 20 截断后的合计（截断后占比会虚高）"
      - order_consistency: "窗口内的 ORDER BY 是否与外层输出排序一致，否则累计占比与行序对不上"
