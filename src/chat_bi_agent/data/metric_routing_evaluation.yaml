      WHERE da.account_type IN ('CURRENT','SAVING')
        AND fbd.dt >= DATE '2026-04-01' AND fbd.dt <= DATE '2026-05-31'
      GROUP BY 1 ORDER BY 1
    expected_route: nl2sql
    route_note: "双时间窗对比——spec 只有一个 time_window"
    expected_result_columns: []
    expected_filters: []
    expected_result_count: {min: 2, max: 2}
    evaluation_criteria:
      - multi_window: "跨两个时间窗对比，单 spec 表达不了"

  - id: mr_n12
