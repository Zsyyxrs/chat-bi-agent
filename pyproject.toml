[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chat-bi-agent"
version = "0.1.0"
description = "Banking BI self-service agent for out-of-bank (行外) phase mock data seeding and demo"
requires-python = ">=3.11"
authors = [
    { name = "Shangyi Zhu", email = "zhusayi1994@gmail.com" }
]
dependencies = [
    "psycopg2-binary>=2.9.0",
    "faker>=20.0.0",
    "pyyaml>=6.0",
    "sqlalchemy>=2.0.0",
    "click>=8.1.0",
    "dashscope>=1.20.0",
    "langfuse>=3.15,<4.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "sqlglot>=20,<27",
    "jieba>=0.42.1",
    "streamlit>=1.30",
    "plotly>=5.20",
    "pandas>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["chat_bi_agent*", "streamlit_app*"]

[tool.setuptools.package-data]
chat_bi_agent = [
    "schema/*.yaml",
    # 值检索快照（scripts/build_value_index.py 生成）。必须随包分发：值检索默认开启，
    # 缺文件时 ValueIndex 退化成空索引且**不报错**——漏掉它就是 metrics.yaml 那次
    # 「语义层在容器里静默关闭」的重演。
    "schema/*.json",
    "data/*.yaml",
    "data/events/*.yaml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"src/chat_bi_agent/agents/p2/prompts/*.py" = ["E501"]
"src/chat_bi_agent/agents/p3/prompts/*.py" = ["E501"]
"tests/shared/test_schema_linker.py" = ["E501"]
"tests/data/*.py" = ["E501"]
"scripts/*.py" = ["E402", "E501"]
"streamlit_app/app.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires running PostgreSQL + seed data",
]
