    fact_alias: fh
    metric_expr: SUM(fh.market_value)
    metric_alias: total_market_value
    hard_filters: []
    date_column: fh.snapshot_dt
    dim_catalog:
      branch_id:        {select_expr: "fh.branch_id",           alias: "branch_id"}
      branch_city:      {select_expr: "dbr.city",               alias: "city",              requires_join: [branch]}
      customer_tier:    {select_expr: "dc.customer_tier",       alias: "customer_tier",     requires_join: [customer]}
      product_category: {select_expr: "dp.product_category",    alias: "product_category",  requires_join: [product]}
    filter_catalog:
      branch_id: {column: "fh.branch_id", type: string}
      customer_tier:
        column: "dc.customer_tier"
        type: enum
        enum_values: [HIGH_NET_WORTH, AFFLUENT, MASS, BASIC]
        requires_join: [customer]
      product_category:
        column: "dp.product_category"
        type: enum
        enum_values: [DEPOSIT, LOAN, WEALTH, FUND, INSURANCE, CARD]
        requires_join: [product]

  # -------------------- 持仓盈亏 --------------------
  - id: holding_pnl
    display_name: 持仓盈亏
    aliases:
      - 持仓盈亏
      - 浮盈浮亏
      - 投资收益
      - 盈亏
      - PnL
    fact_table: fct_holding
    fact_alias: fh
    metric_expr: SUM(fh.pnl)
    metric_alias: total_pnl
    hard_filters: []
    date_column: fh.snapshot_dt
    dim_catalog:
      branch_id:        {select_expr: "fh.branch_id",        alias: "branch_id"}
      customer_tier:    {select_expr: "dc.customer_tier",    alias: "customer_tier",    requires_join: [customer]}
      product_category: {select_expr: "dp.product_category", alias: "product_category", requires_join: [product]}
    filter_catalog:
      branch_id: {column: "fh.branch_id", type: string}
      product_category:
        column: "dp.product_category"
        type: enum
        enum_values: [DEPOSIT, LOAN, WEALTH, FUND, INSURANCE, CARD]
        requires_join: [product]

  # -------------------- 风险事件数 --------------------
  - id: risk_event_count
    display_name: 风险事件数
    aliases:
      - 风险事件数
      - 风险事件数量
      - 有多少风险事件
