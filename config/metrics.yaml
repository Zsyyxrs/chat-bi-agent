    fact_table: fct_risk_event
    fact_alias: fre
    metric_expr: COUNT(*)
    metric_alias: risk_event_count
    hard_filters: []
    date_column: fre.dt
    dim_catalog:
      branch_id:  {select_expr: "fre.branch_id", alias: "branch_id"}
      event_type: {select_expr: "fre.event_type", alias: "event_type"}
