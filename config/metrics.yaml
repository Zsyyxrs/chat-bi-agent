    dim_catalog:
      region:       {select_expr: "dbr.region",       alias: "region"}
      province:     {select_expr: "dbr.province",     alias: "province"}
      branch_level: {select_expr: "dbr.branch_level", alias: "branch_level"}
    filter_catalog:
      region:   {column: "dbr.region",   type: string}
      province: {column: "dbr.province", type: string}
      branch_level:
        column: "dbr.branch_level"
        type: enum
        enum_values: [HEAD, PROVINCE, CITY, SUBBRANCH]

  # -------------------- 总余额（不分账户类型）--------------------
  - id: total_balance
    display_name: 总余额（日均，全账户类型）
    aliases:
      - 总余额
      - 全部余额
      - 余额合计
      - 资金余额
    fact_table: fct_balance_daily
    fact_alias: fbd
    metric_expr: AVG(fbd.balance)
    metric_alias: avg_total_balance
    hard_filters: []
    date_column: fbd.dt
    dim_catalog:
      branch_id:    {select_expr: "fbd.branch_id",   alias: "branch_id"}
      account_type: {select_expr: "da.account_type", alias: "account_type", requires_join: [account]}
      branch_city:  {select_expr: "dbr.city",        alias: "city",         requires_join: [branch]}
    filter_catalog:
      branch_id: {column: "fbd.branch_id", type: string}
      account_type:
        column: "da.account_type"
        type: enum
        enum_values: [CURRENT, SAVING, LOAN, CARD, INVESTMENT]
        requires_join: [account]
